# Port du service
server.port=8083

# Nom du service
spring.application.name=rental-service

# URL du serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/rental_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=mySuperStrongJwtSecretKey_32chars_min_123456

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Désactiver Spring Security temporairement
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Configuration pour communiquer avec car-service
car.service.url=http://localhost:8082
car.service.base-path=/api/cars

# Logging
logging.level.com.carmanagement.rental=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Actuator pour Eureka
eureka.instance.health-check-url=http://localhost:8083/actuator/health
eureka.instance.status-page-url=http://localhost:8083/actuator/info
