# Port
server.port=8081

# Nom du service (important pour Eureka)
spring.application.name=auth-service

URL du serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver


# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (tu ajouteras plus tard)
jwt.secret=mySecretKey1234567890mySecretKey1234567890
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.carmanagement.auth=DEBUG

# Swagger access
springdoc.swagger-ui.path=/swagger-ui.html

# Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Actuator pour Eureka
eureka.instance.health-check-url=http://localhost:8081/actuator/health
eureka.instance.status-page-url=http://localhost:8081/actuator/info


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.info.title=Auth Service API
springdoc.info.version=1.0
springdoc.info.description=Endpoints pour l'inscription, la connexion et la génération de JWT
