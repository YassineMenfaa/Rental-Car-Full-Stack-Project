server.port=8080
spring.application.name=api-gateway

# URL du serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Route pour auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

jwt.secret=mySuperStrongJwtSecretKey_32chars_min_123456


# Route pour car-service
spring.cloud.gateway.routes[1].id=car-service
spring.cloud.gateway.routes[1].uri=lb://car-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/cars/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# Route pour rental-service
spring.cloud.gateway.routes[2].id=rental-service
spring.cloud.gateway.routes[2].uri=lb://rental-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rentals/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# Route pour chatbot-service (AI Chat)
spring.cloud.gateway.routes[3].id=chatbot-service
spring.cloud.gateway.routes[3].uri=lb://chatbot-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/chat/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0


# CORS configuration
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].allowed-headers=*

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Health check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

