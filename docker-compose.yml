services:
  # Base de données pour auth-service
  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - car-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de données pour car-service
  postgres-car:
    image: postgres:15
    container_name: postgres-car
    environment:
      POSTGRES_DB: car_db
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_car_data:/var/lib/postgresql/data
    networks:
      - car-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de données pour rental-service
  postgres-rental:
    image: postgres:15
    container_name: postgres-rental
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_rental_data:/var/lib/postgresql/data
    networks:
      - car-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eureka Server
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - car-network
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - car-network
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    networks:
      - car-network
    depends_on:
      - eureka-server
      - postgres-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # Car Service
  car-service:
    build: ./car-service
    container_name: car-service
    ports:
      - "8082:8082"
    networks:
      - car-network
    depends_on:
      - eureka-server
      - postgres-car
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-car:5432/car_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # Rental Service
  rental-service:
    build: ./rental-service
    container_name: rental-service
    ports:
      - "8083:8083"
    networks:
      - car-network
    depends_on:
      - eureka-server
      - postgres-rental
      - car-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rental:5432/rental_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CAR_SERVICE_URL: http://car-service:8082

  # ==========================================
  # OLLAMA - LOCAL AI MODEL SERVER
  # ==========================================
  # Ollama runs the Llama 3.2 model locally.
  # The chatbot-service connects to this container.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models between restarts
      - ollama_data:/root/.ollama
    networks:
      - car-network
    # Pull the model on first startup
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && wait" ]

  # ==========================================
  # CHATBOT SERVICE - AI-POWERED CHAT
  # ==========================================
  chatbot-service:
    build: ./chatbot-service
    container_name: chatbot-service
    ports:
      - "8084:8084"
    networks:
      - car-network
    depends_on:
      - eureka-server
      - ollama
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Connect to Ollama container
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2

  # Frontend Application
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4200:80"
    networks:
      - car-network
    depends_on:
      - api-gateway

networks:
  car-network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_car_data:
  postgres_rental_data:
  ollama_data:
