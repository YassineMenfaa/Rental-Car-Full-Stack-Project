# Car Service - Database Configuration
spring.application.name=car-service
server.port=8082

# PostgreSQL (Local - Port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres-car
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# H2 Database (Fallback - Persistent file)
# spring.datasource.url=jdbc:h2:file:./data/cardb;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# JWT Secret (must match auth-service)
jwt.secret=mySuperStrongJwtSecretKey_32chars_min_123456

# Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
